<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staffing — Current</title>
<script src="../../lib/data-source.js?v=20260829b"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#1a1a2e; color:#e0e0e0; }
#header { background:#16213e; padding:10px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #0f3460; flex-wrap:wrap; gap:8px; }
#header h1 { font-size:1.2rem; color:#4ecca3; }
.controls { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.toggle-group { display:flex; gap:0; border:1px solid #2a3a5e; border-radius:4px; overflow:hidden; }
.toggle-group button { padding:5px 12px; font-size:0.8rem; background:#16213e; color:#aaa; border:none; cursor:pointer; }
.toggle-group button.active { background:#0f3460; color:#4ecca3; }
a.full-link { font-size:0.75rem; color:#888; text-decoration:none; }
a.full-link:hover { color:#4ecca3; }
#status { font-size:0.7rem; color:#888; }
#main { padding:20px; display:flex; gap:24px; align-items:flex-start; }
#left { flex:1; min-width:0; }
#right { flex:1; min-width:0; background:#16213e; border:1px solid #2a3a5e; border-radius:6px; padding:14px 18px; }
#right h3 { font-size:0.9rem; color:#4ecca3; margin-bottom:10px; }
#right table { min-width:0; width:100%; font-size:0.82rem; }
#right th, #right td { padding:5px 10px; }
#right td.mon { font-weight:700; color:#fff; }
#leaverBoxes { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:14px; }
.lbox { background:#0f3460; border:1px solid #2a3a5e; border-radius:6px; padding:8px 6px; text-align:center; }
.lbox .m { font-size:1rem; color:#aaa; }
.lbox .n { font-size:1.4rem; font-weight:700; color:#fff; margin-top:2px; }
.lbox .n.zero { color:#556; }
.lbox.cur { border-color:#4ecca3; }
.lbox { cursor:pointer; }
.lbox:hover { background:#13325a; }
.lbox.sel { background:#1a4a6e; border-color:#4ecca3; box-shadow:0 0 0 1px #4ecca3 inset; }
#leavers tr.hl td { background:rgba(78,204,163,0.18); color:#fff; }
#right td, #right th { text-align:left; }
#ppLabel { color:#aaa; font-size:1.2rem; margin-bottom:14px; }
#ppLabel b { color:#e0e0e0; }
table { border-collapse:collapse; font-size:1.15rem; min-width:0; width:100%; }
th, td { padding:8px 12px; text-align:right; border-bottom:1px solid #0f3460; white-space:nowrap; font-variant-numeric:tabular-nums; }
th { background:#0f3460; color:#aaa; font-weight:600; font-size:0.9rem; }
th:first-child, td:first-child { text-align:left; }
td:first-child { color:#e0e0e0; font-weight:600; background:#16213e; }
tr.bdg td { background:rgba(155,89,182,0.06); }
tr.act td { background:rgba(78,204,163,0.05); cursor:pointer; }
tr.act:hover td { filter:brightness(1.2); }
td.tot { font-weight:700; color:#fff; border-left:2px solid #2a3a5e; }
.delta { font-size:1rem; }
tr.dlt td { background:rgba(78,204,163,0.03); font-size:1rem; }
.delta.pos { color:#4ecca3; }
.delta.neg { color:#e74c3c; }
.delta.zero { color:#888; }
#detail { display:none; margin-top:20px; background:#16213e; border:1px solid #2a3a5e; border-radius:8px; padding:14px 18px; }
#detail.show { display:block; }
#detail h2 { font-size:1rem; color:#4ecca3; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
#detail h2 button { padding:2px 10px; font-size:0.7rem; background:#0f3460; color:#ccc; border:1px solid #555; border-radius:4px; cursor:pointer; }
#detail table { width:100%; min-width:0; font-size:0.85rem; }
#detail th, #detail td { padding:5px 10px; text-align:left; }
#detail th.num, #detail td.num { text-align:right; }
#detail tfoot td { font-weight:700; color:#fff; border-top:2px solid #4ecca3; }
#detail th.sortable { cursor:pointer; user-select:none; }
#detail th.sortable:hover { color:#4ecca3; }
</style>
</head>
<body>

<div id="header">
  <h1>Staffing — Current PP</h1>
  <div class="controls">
    <div class="toggle-group" id="metricToggle">
      <button data-metric="headcount" class="active">HC</button>
      <button data-metric="hours">Hours</button>
      <button data-metric="prodhours">Prod Hours</button>
      <button data-metric="cost_total">Total Cost</button>
    </div>
    <div class="toggle-group">
      <button class="active">Current</button>
      <button onclick="location.href='../index.html'">Full</button>
    </div>
    <span id="status">Loading…</span>
  </div>
</div>

<div id="main">
  <div id="left">
    <div id="ppLabel"></div>
    <table id="grid"></table>
    <div id="detail">
      <h2><span id="modalTitle"></span><button onclick="closeModal()">Close ✕</button></h2>
      <div id="modalBody">Loading…</div>
    </div>
  </div>
  <div id="right">
    <h3>Workers leaving — by end date (HR register)</h3>
    <div id="leaverBoxes"></div>
    <div id="leavers">Loading…</div>
  </div>
</div>

<script>
const LABOR = ['local','wfe','h2a','f_local','fuerte'];
const LABOR_LABEL = { local:'Local', wfe:'WFE', h2a:'H2A', f_local:'F(local)', fuerte:'Fuerte' };
const PROD_MULT = { local:1, wfe:1.2, h2a:1.2, f_local:1.2, fuerte:1.2 };
const PP_COUNT = 26;

let metric = 'headcount';
let budget = {};              // [pp][labor] = headcount (latest version, expanded)
let actuals = { 2025:{}, 2026:{} }; // [pp][labor] = {headcount,hours,cost_total}
let ppDates = {};             // 2026 [pp] = check_date
let currentPP = 1;
let rates = {};               // [labor] = {dollar_per_hour_total, hours_per_head_pp}

async function loadBudget() {
  const client = await DataSource.getClient();
  const { data, error } = await client.from('hr_budgets').select('*').eq('year', 2026);
  if (error) throw error;
  const versions = {};
  for (const r of data || []) {
    const v = versions[r.saved_at] || (versions[r.saved_at] = {});
    (v[r.pp] || (v[r.pp] = {}))[r.labor_type] = Number(r.headcount);
  }
  const keys = Object.keys(versions).sort();
  if (!keys.length) throw new Error('no budget versions');
  const sparse = versions[keys[keys.length - 1]];
  // Expand: carry each sparse row forward to later PPs
  let last = null;
  for (let pp = 1; pp <= PP_COUNT; pp++) {
    if (sparse[pp]) last = sparse[pp];
    if (last) budget[pp] = { ...last };
  }
}

async function loadActuals() {
  const client = await DataSource.getClient();
  const { data, error } = await client.from('hr_staffing_pp_v').select('*').gte('year', 2025);
  if (error) throw error;
  for (const r of data) {
    if (!actuals[r.year]) continue;
    const y = actuals[r.year];
    (y[r.pp] || (y[r.pp] = {}))[r.labor_type] = {
      headcount: r.headcount,
      hours: parseFloat(r.hours) || 0,
      cost_total: parseFloat(r.cost_total) || 0,
    };
    if (r.year === 2026) {
      ppDates[r.pp] = r.check_date;
      if (r.pp > currentPP) currentPP = r.pp;
    }
  }
}

// Same forecast rates as the full page: $/hr from 2026 YTD, hours/head/PP from full 2025.
function computeRates() {
  for (const l of LABOR) {
    let h26 = 0, ct = 0, h25 = 0, hc25 = 0;
    for (let pp = 1; pp <= currentPP; pp++) {
      const a = actuals[2026][pp]?.[l];
      if (a) { h26 += a.hours; ct += a.cost_total; }
    }
    for (let pp = 1; pp <= 26; pp++) {
      const a = actuals[2025][pp]?.[l];
      if (a) { h25 += a.hours; hc25 += a.headcount; }
    }
    rates[l] = {
      dollar_per_hour_total: h26 > 0 ? ct / h26 : 0,
      hours_per_head_pp: hc25 > 0 ? h25 / hc25 : 0,
    };
  }
}

function actualVal(l) {
  const a = actuals[2026][currentPP]?.[l];
  if (!a) return 0;
  if (metric === 'headcount')  return a.headcount;
  if (metric === 'hours')      return a.hours;
  if (metric === 'prodhours')  return a.hours * PROD_MULT[l];
  if (metric === 'cost_total') return a.cost_total;
  return 0;
}
function budgetVal(l) {
  const bHC = budget[currentPP]?.[l];
  if (bHC == null) return 0;
  if (metric === 'headcount') return bHC;
  const r = rates[l];
  const fHours = bHC * r.hours_per_head_pp;
  if (metric === 'hours')      return fHours;
  if (metric === 'prodhours')  return fHours * PROD_MULT[l];
  if (metric === 'cost_total') return fHours * r.dollar_per_hour_total;
  return 0;
}

// House style: all dates that include a year render as MM/DD/YY.
function fmtDate(iso) {
  if (!iso) return '';
  return iso.slice(5, 7) + '/' + iso.slice(8, 10) + '/' + iso.slice(2, 4);
}
function fmt(v) {
  if (metric === 'headcount') return Math.round(v).toString();
  if (metric === 'cost_total') {
    if (Math.abs(v) >= 1000) return '$' + Math.round(v / 1000).toLocaleString() + 'k';
    return '$' + Math.round(v).toLocaleString();
  }
  return Math.round(v).toLocaleString();
}
function deltaTag(a, b) {
  const d = a - b;
  const cls = d > 0 ? 'pos' : d < 0 ? 'neg' : 'zero';
  const sign = d > 0 ? '+' : '';
  let s;
  if (metric === 'headcount') s = sign + Math.round(d);
  else if (metric === 'cost_total') s = sign + (Math.abs(d) >= 1000 ? '$' + Math.round(d/1000).toLocaleString() + 'k' : '$' + Math.round(d).toLocaleString());
  else s = sign + Math.round(d).toLocaleString();
  return '<span class="delta ' + cls + '">' + s + '</span>';
}

function render() {
  const date = ppDates[currentPP] || '';
  document.getElementById('ppLabel').innerHTML = 'As of <b>' + fmtDate(date) + '</b>';
  let html = '<thead><tr><th></th>';
  for (const l of LABOR) html += '<th>' + LABOR_LABEL[l] + '</th>';
  html += '<th>Tot</th></tr></thead><tbody>';
  let bTot = 0, aTot = 0;
  let bRow = '<tr class="bdg"><td>Budget</td>';
  let aRow = '<tr class="act"><td>Actual</td>';
  let dRow = '<tr class="dlt"><td>Δ</td>';
  for (const l of LABOR) {
    const b = budgetVal(l), a = actualVal(l);
    bTot += b; aTot += a;
    bRow += '<td>' + fmt(b) + '</td>';
    aRow += '<td onclick="openDetail(\'' + l + '\')">' + fmt(a) + '</td>';
    dRow += '<td>' + deltaTag(a, b) + '</td>';
  }
  bRow += '<td class="tot">' + fmt(bTot) + '</td></tr>';
  aRow += '<td class="tot" onclick="openDetail()">' + fmt(aTot) + '</td></tr>';
  dRow += '<td class="tot">' + deltaTag(aTot, bTot) + '</td></tr>';
  document.getElementById('grid').innerHTML = html + bRow + aRow + dRow + '</tbody>';
}

async function openDetail(labor) {
  document.getElementById('detail').classList.add('show');
  const scope = labor ? LABOR_LABEL[labor] : 'all';
  document.getElementById('modalTitle').textContent = '2026 PP ' + currentPP + ' — employees (' + scope + ')';
  document.getElementById('modalBody').textContent = 'Loading…';
  try {
    const client = await DataSource.getClient();
    let q = client
      .from('hr_staffing_pp_detail_v').select('*')
      .eq('year', 2026).eq('pp', currentPP)
      .order('hr_work_authorization_id').order('employee_name');
    if (labor) q = q.eq('labor_type', labor);
    const { data, error } = await q;
    if (error) throw error;
    if (!data || !data.length) {
      document.getElementById('modalBody').innerHTML = '<div style="color:#888">No employees.</div>';
      return;
    }
    detailRows = data.map(r => ({
      name:   r.employee_name || '',
      dept:   r.hr_department_id || '',
      status: r.hr_work_authorization_id || '',
      hours:  parseFloat(r.total_hours) || 0,
      cost:   parseFloat(r.total_cost) || 0,
    }));
    detailSort = { key: 'status', dir: 1 };
    renderDetail();
  } catch (e) {
    document.getElementById('modalBody').innerHTML = '<div style="color:#e74c3c">Error: ' + e.message + '</div>';
  }
}

let leaverRows = [];
let selectedMon = null;
function selectMonth(mon) {
  selectedMon = selectedMon === mon ? null : mon;
  document.querySelectorAll('#leaverBoxes .lbox').forEach(b =>
    b.classList.toggle('sel', b.dataset.mon === selectedMon));
  document.querySelectorAll('#leavers tbody tr').forEach(tr =>
    tr.classList.toggle('hl', selectedMon != null && tr.dataset.mon === selectedMon));
}

let detailRows = [];
let detailSort = { key: 'status', dir: 1 };
const DETAIL_COLS = [
  { key:'name',   label:'Name' },
  { key:'dept',   label:'Dept' },
  { key:'status', label:'Status' },
  { key:'hours',  label:'Hours', num:true },
  { key:'cost',   label:'Total Cost', num:true },
];

function sortDetail(key) {
  if (detailSort.key === key) detailSort.dir = -detailSort.dir;
  else detailSort = { key, dir: DETAIL_COLS.find(c => c.key === key).num ? -1 : 1 };
  renderDetail();
}

function renderDetail() {
  const { key, dir } = detailSort;
  const isNum = DETAIL_COLS.find(c => c.key === key).num;
  const sorted = [...detailRows].sort((a, b) => {
    const cmp = isNum ? a[key] - b[key] : String(a[key]).localeCompare(String(b[key])) || a.name.localeCompare(b.name);
    return cmp * dir;
  });
  let rows = '', totH = 0, totC = 0;
  for (const r of sorted) {
    totH += r.hours; totC += r.cost;
    rows += `<tr><td>${r.name}</td><td>${r.dept}</td><td>${r.status}</td>
      <td class="num">${r.hours.toFixed(2)}</td>
      <td class="num">$${r.cost.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2})}</td></tr>`;
  }
  const ths = DETAIL_COLS.map(c => {
    const arrow = c.key === key ? (dir === 1 ? ' ▲' : ' ▼') : '';
    return `<th class="${c.num ? 'num ' : ''}sortable" onclick="sortDetail('${c.key}')">${c.label}${arrow}</th>`;
  }).join('');
  document.getElementById('modalBody').innerHTML = `
    <table>
      <thead><tr>${ths}</tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td colspan="3">${sorted.length} employees</td>
        <td class="num">${totH.toFixed(2)}</td>
        <td class="num">$${totC.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2})}</td></tr></tfoot>
    </table>`;
}
function closeModal() { document.getElementById('detail').classList.remove('show'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

document.getElementById('metricToggle').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return;
  metric = btn.dataset.metric;
  document.querySelectorAll('#metricToggle button').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

// ===== Upcoming visa leavers (right panel) =====
// Planning view: active visa workers (WFE/H2A/FUERTE) by end_date from the HR
// register (hr_visa_end_dates_v). Six boxes = this month + next five; the list
// below shows every future end date, including beyond the six boxes.
async function loadLeavers() {
  const client = await DataSource.getClient();
  const now = new Date();
  const today = now.toISOString().slice(0, 10);
  // Window = the six month boxes: this month through end of month +5
  const limit = new Date(now.getFullYear(), now.getMonth() + 6, 0);
  const limitStr = limit.getFullYear() + '-' + String(limit.getMonth() + 1).padStart(2, '0') + '-' + String(limit.getDate()).padStart(2, '0');
  const { data, error } = await client
    .from('hr_visa_end_dates_v')
    .select('employee_name, hr_department_id, hr_work_authorization_id, end_date')
    .gte('end_date', today)
    .lte('end_date', limitStr)
    .order('end_date').order('employee_name');
  if (error) throw error;
  renderLeavers(data || []);
}

function renderLeavers(rows) {
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const now = new Date();
  const byMonth = {};
  for (const r of rows) {
    const m = r.end_date.slice(0, 7);
    byMonth[m] = (byMonth[m] || 0) + 1;
  }
  // Six boxes: this month + next five
  let boxes = '';
  for (let i = 0; i < 6; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
    const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    const n = byMonth[key] || 0;
    boxes += '<div class="lbox' + (i === 0 ? ' cur' : '') + '" data-mon="' + key + '" onclick="selectMonth(\'' + key + '\')">'
      + '<div class="m">' + MONTHS[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2) + '</div>'
      + '<div class="n' + (n === 0 ? ' zero' : '') + '">' + n + '</div></div>';
  }
  document.getElementById('leaverBoxes').innerHTML = boxes;

  const el = document.getElementById('leavers');
  if (!rows.length) { el.innerHTML = '<div style="color:#888">No end dates on file for active visa workers.</div>'; return; }
  let body = '';
  for (const r of rows) {
    body += '<tr data-mon="' + r.end_date.slice(0, 7) + '"><td class="mon">' + fmtDate(r.end_date) + '</td>'
      + '<td>' + (r.hr_work_authorization_id || '') + '</td>'
      + '<td>' + (r.employee_name || '') + '</td>'
      + '<td>' + (r.hr_department_id || '') + '</td></tr>';
  }
  el.innerHTML = '<table><thead><tr><th>End date</th><th>Visa</th><th>Name</th><th>Dept</th></tr></thead>'
    + '<tbody>' + body + '</tbody></table>';
}

(async () => {
  try {
    await Promise.all([loadBudget(), loadActuals()]);
    computeRates();
    render();
    document.getElementById('status').textContent = '';
    await loadLeavers();
  } catch (e) {
    document.getElementById('status').textContent = 'Error: ' + e.message;
  }
})();
</script>
</body>
</html>
