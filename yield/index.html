<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yield</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #f5f0eb; display: flex; flex-direction: column; }
  #subnav { background: #3d7a4d; padding: 0 20px; display: flex; align-items: center;
            gap: 4px; height: 38px; flex-shrink: 0; }
  #subnav .crop { padding: 0 16px; height: 100%; display: flex; align-items: center;
                  cursor: pointer; color: #cfe6d5; font-size: 0.82rem; font-weight: 600;
                  border-bottom: 3px solid transparent; user-select: none; }
  #subnav .crop:hover { color: #fff; }
  #subnav .crop.active { color: #fff; border-bottom-color: #fff; }
  .frames { flex: 1; position: relative; }
  .frames iframe { position: absolute; inset: 0; width: 100%; height: 100%;
                   border: none; display: none; }
  .frames iframe.active { display: block; }
</style>
</head>
<body>

<div id="subnav"></div>
<div class="frames" id="frames"></div>

<script>
// Sub-tabs for the Yield section. Cuke keeps living at ../cukes/ so all its
// history and deep links survive the rename.
const CROPS = [
  { id: 'cuke',    label: 'Cuke',    src: '../cukes/index.html' },
  { id: 'lettuce', label: 'Lettuce', src: 'lettuce.html' },
];
const BUILD_VER = '20260809a';

const nav = document.getElementById('subnav');
const framesEl = document.getElementById('frames');
const frames = {};

function show(id) {
  const crop = CROPS.find(c => c.id === id) || CROPS[0];
  // Keep the choice in the hash so a reload (and the parent shell) stays put.
  if (location.hash.slice(1) !== crop.id) location.hash = crop.id;
  if (!frames[crop.id]) {
    const f = document.createElement('iframe');
    f.src = crop.src + (crop.src.includes('?') ? '&' : '?') + 'v=' + BUILD_VER;
    frames[crop.id] = f;
    framesEl.appendChild(f);
  }
  Object.entries(frames).forEach(([k, f]) => f.classList.toggle('active', k === crop.id));
  nav.querySelectorAll('.crop').forEach(el => el.classList.toggle('active', el.dataset.id === crop.id));
}

CROPS.forEach(c => {
  const el = document.createElement('div');
  el.className = 'crop';
  el.dataset.id = c.id;
  el.textContent = c.label;
  el.onclick = () => show(c.id);
  nav.appendChild(el);
});

window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1) || 'cuke');
</script>
</body>
</html>
