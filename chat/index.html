<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm AI Chat</title>
<script src="../lib/data-source.js?v=20260813a"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

/* ── header ─────────────────────────────────────────────── */
#header { background: #16213e; padding: 8px 20px; border-bottom: 1px solid #0f3460; display: flex; align-items: center; gap: 20px; flex-shrink: 0; }
#header h1 { font-size: 1.1rem; color: #4ecca3; }
.page-tabs { display: flex; gap: 4px; }
.page-tabs a { padding: 4px 14px; font-size: 0.8rem; color: #888; text-decoration: none; border-radius: 6px 6px 0 0; border: 1px solid transparent; }
.page-tabs a.active { color: #4ecca3; border-color: #0f3460; border-bottom-color: #16213e; background: #1a1a2e; }
.page-tabs a:hover { color: #e0e0e0; }
#header .stats { font-size: 0.7rem; color: #888; display: flex; gap: 16px; align-items: center; margin-left: auto; }
#header .stats #versionStamp { font-size: 0.75rem; color: #e0e0e0; }

/* ── layout ─────────────────────────────────────────────── */
#body { flex: 1; display: flex; overflow: hidden; }

#sidebar { width: 220px; flex-shrink: 0; background: #16213e; border-right: 1px solid #0f3460; display: flex; flex-direction: column; }
#new-chat { margin: 10px; padding: 7px 12px; font-size: 0.8rem; background: transparent; color: #4ecca3; border: 1px solid #0f3460; border-radius: 6px; cursor: pointer; }
#new-chat:hover { background: #0f3460; }
#convo-list { flex: 1; overflow-y: auto; padding: 0 6px 10px; }
.convo-item { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 0.78rem; color: #aaa; }
.convo-item:hover { background: #1a1a2e; color: #e0e0e0; }
.convo-item.active { background: #0f3460; color: #e0e0e0; }
.convo-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.convo-del { background: none; border: none; color: #555; cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 2px; }
.convo-del:hover { color: #e74c3c; }
.convo-empty { padding: 8px; font-size: 0.72rem; color: #555; }

#chat-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }

/* ── messages ───────────────────────────────────────────── */
.msg { max-width: 900px; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; line-height: 1.55; }
.msg-user { align-self: flex-end; background: #0f3460; border-bottom-right-radius: 2px; max-width: 70%; white-space: pre-wrap; }
.msg-ai { align-self: flex-start; background: #16213e; border: 1px solid #0f3460; border-bottom-left-radius: 2px; width: 100%; }

.status-line { color: #888; font-size: 0.8rem; }
.status-line::after { content: ''; display: inline-block; width: 6px; height: 6px; margin-left: 6px; border-radius: 50%; background: #4ecca3; animation: pulse 1.1s ease-in-out infinite; vertical-align: middle; }
@keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

.err { color: #e74c3c; background: #2a1a1a; border: 1px solid #e74c3c; border-radius: 6px; padding: 8px 10px; font-size: 0.8rem; margin-top: 6px; }
.muted { color: #666; font-size: 0.72rem; }

/* ── markdown ───────────────────────────────────────────── */
.md { margin: 4px 0; }
.md p { margin: 0 0 8px; }
.md p:last-child { margin-bottom: 0; }
.md-h { font-size: 0.9rem; color: #4ecca3; margin: 10px 0 6px; }
.md-list { margin: 0 0 8px 20px; }
.md-list li { margin: 2px 0; }
.md-code { background: #1a1a2e; padding: 1px 5px; border-radius: 3px; font-family: Consolas, Monaco, monospace; font-size: 0.78rem; color: #4ecca3; }
.md-pre { background: #1a1a2e; padding: 10px; border-radius: 6px; overflow-x: auto; margin: 0 0 8px; }
.md-pre code { font-family: Consolas, Monaco, monospace; font-size: 0.75rem; color: #aaa; }
.md a { color: #6ba8e8; }
.md-table { border-collapse: collapse; font-size: 0.78rem; margin: 0 0 8px; }
.md-table th, .md-table td { border: 1px solid #0f3460; padding: 3px 8px; text-align: left; }
.md-table th { color: #4ecca3; background: #1a1a2e; }

/* ── tool activity ──────────────────────────────────────── */
.tool { margin: 10px 0; border-left: 2px solid #0f3460; padding-left: 10px; }
.tool.tool-error { border-left-color: #e74c3c; }
.tool-head { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: #888; }
.tool-spin { width: 7px; height: 7px; border-radius: 50%; background: #f0a04b; flex-shrink: 0; animation: pulse 1.1s ease-in-out infinite; }
.tool-spin.done { background: #4ecca3; animation: none; }
.tool-purpose { color: #aaa; }
.tool-meta { color: #666; margin-left: auto; }
.tool-sql { margin: 4px 0; }
.tool-sql summary { color: #666; font-size: 0.68rem; cursor: pointer; }
.tool-sql pre { font-size: 0.7rem; margin-top: 4px; padding: 8px; background: #1a1a2e; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; font-family: Consolas, Monaco, monospace; color: #aaa; }
.tool-body { margin-top: 6px; }

/* ── result tables ──────────────────────────────────────── */
.result-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; display: block; overflow-x: auto; max-height: 420px; }
.result-table th { text-align: left; padding: 4px 8px; border-bottom: 2px solid #0f3460; color: #4ecca3; background: #16213e; position: sticky; top: 0; cursor: pointer; white-space: nowrap; }
.result-table th:hover { color: #6fd39a; }
.result-table td { padding: 3px 8px; border-bottom: 1px solid #0f3460; white-space: nowrap; }
.result-table th.num, .result-table td.num { text-align: right; }
.table-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 5px; }
.link-btn { background: none; border: none; color: #6ba8e8; font-size: 0.7rem; cursor: pointer; padding: 0; }
.link-btn:hover { color: #8fc2f5; text-decoration: underline; }

/* ── charts ─────────────────────────────────────────────── */
.chart-wrap { margin: 12px 0; background: #1a1a2e; border: 1px solid #0f3460; border-radius: 6px; padding: 10px; height: 280px; display: flex; flex-direction: column; }
.chart-title { font-size: 0.78rem; color: #4ecca3; margin-bottom: 6px; flex-shrink: 0; }
.chart-wrap canvas { flex: 1; min-height: 0; }

/* ── turn footer + follow-ups ───────────────────────────── */
.turn-foot { display: flex; gap: 12px; align-items: center; margin-top: 10px; padding-top: 6px; border-top: 1px solid #0f3460; }
.turn-foot:empty { display: none; }
.followups { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { padding: 5px 11px; font-size: 0.72rem; background: #0f3460; color: #aaa; border: 1px solid transparent; border-radius: 12px; cursor: pointer; text-align: left; }
.chip:hover { color: #e0e0e0; border-color: #4ecca3; }

/* ── composer ───────────────────────────────────────────── */
.examples { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 20px 8px; }
.example-btn { padding: 4px 10px; font-size: 0.7rem; background: #0f3460; color: #aaa; border: 1px solid transparent; border-radius: 12px; cursor: pointer; }
.example-btn:hover { color: #e0e0e0; border-color: #4ecca3; }

#input-area { padding: 10px 20px; border-top: 1px solid #0f3460; display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0; }
#question { flex: 1; background: #16213e; border: 1px solid #0f3460; color: #e0e0e0; padding: 10px 14px; border-radius: 6px; font-size: 0.85rem; font-family: inherit; outline: none; resize: none; line-height: 1.4; max-height: 160px; }
#question:focus { border-color: #4ecca3; }
#question::placeholder { color: #555; }
#question:disabled { opacity: 0.5; }
.btn-primary { padding: 9px 18px; font-size: 0.85rem; background: #4ecca3; color: #1a1a2e; border: 1px solid #4ecca3; border-radius: 6px; cursor: pointer; font-weight: 600; }
.btn-primary:hover { background: #3dbb94; }
.btn-stop { padding: 9px 18px; font-size: 0.85rem; background: transparent; color: #e74c3c; border: 1px solid #e74c3c; border-radius: 6px; cursor: pointer; font-weight: 600; }
.btn-stop:hover { background: #2a1a1a; }
</style>
</head>
<body>

<div id="header">
  <h1>Farm AI</h1>
  <nav class="page-tabs">
    <a href="index.html" class="active">Chat</a>
    <a href="context.html">Business Context</a>
    <a href="context-review.html">Review</a>
  </nav>
  <div class="stats">
    <span id="versionStamp">08-13 · opus-5</span>
  </div>
</div>

<div id="body">
  <aside id="sidebar">
    <button id="new-chat">+ New chat</button>
    <div id="convo-list"></div>
  </aside>

  <div id="chat-wrap">
    <div id="messages"></div>
    <div class="examples" id="examples">
      <button class="example-btn">Total cases invoiced last week</button>
      <button class="example-btn">Top 10 customers by 2026 sales</button>
      <button class="example-btn">Cuke harvest pounds per greenhouse this month</button>
      <button class="example-btn">Which greenhouse is underperforming, and why?</button>
      <button class="example-btn">Lettuce yield by pond vs the 650k lb target</button>
    </div>
    <div id="input-area">
      <textarea id="question" rows="1" placeholder="Ask a question about your farm data…  (Shift+Enter for a new line)"></textarea>
      <button class="btn-primary" id="ask-btn">Ask</button>
      <button class="btn-stop" id="stop-btn" style="display:none">Stop</button>
    </div>
  </div>
</div>

<script src="chat.js?v=20260813a"></script>
</body>
</html>
